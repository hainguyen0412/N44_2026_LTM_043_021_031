name: Windows build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: msys2 {0}
        working-directory: 01_Code
    steps:
      - uses: actions/checkout@v7
      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
      - name: Configure
        run: cmake --preset windows-release
      - name: Build
        run: cmake --build --preset windows-release
      - name: Unit and localhost integration tests
        run: |
          mkdir -p output/test_results
          ctest --preset windows-release --output-junit "$PWD/output/test_results/ctest.xml"
      - name: Package source and Windows release
        run: |
          python -B tools/package_release.py
          python -B tools/package_release.py --with-binaries
          python -B -c "from pathlib import Path; import subprocess,sys; z=max(Path('build/releases').glob('*-windows-*.zip')); subprocess.run([sys.executable,'-B','tools/release_smoke.py',str(z),'--destination','output/release check with spaces'],check=True)"
      - name: Keep test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-test-results
          if-no-files-found: ignore
          retention-days: 7
          path: |
            01_Code/build/windows-release/Testing/
            01_Code/output/test_results/
